name: dingo-ubuntu

on: [push, pull_request]

jobs:
  install-linux:
    name: Install on Linux OS
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl wget git build-essential

      - name: Accept Anaconda ToS
        run: |
          conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main
          conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/r

      - name: Run setup_env.sh
        run: |
          bash -e setup_env.sh --env local

      - name: Record versions
        run: |
          echo "OS INFORMATION:" > VERSIONS.txt
          cat /etc/os-release >> VERSIONS.txt
          echo "\nAPT PACKAGES:" >> VERSIONS.txt
          dpkg -l >> VERSIONS.txt
          echo "\nPYTHON PACKAGES:" >> VERSIONS.txt
          pip list >> VERSIONS.txt

      - name: Upload versions
        uses: actions/upload-artifact@v4
        with:
          name: versions
          path: VERSIONS.txt
