name: pema-nf

on: [push, pull_request]

jobs:
  nextflow-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow 24.10.0
        run: |
          wget -q https://github.com/nextflow-io/nextflow/releases/download/v24.10.0/nextflow
          chmod +x nextflow
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      # ✅ Create a persistent isolated Nextflow home
      - name: Setup isolated Nextflow home
        id: nxfhome
        run: echo "NXF_HOME=$(mktemp -d)" >> $GITHUB_ENV

      # ✅ Warm up dependencies in the same NXF_HOME
      - name: Warm up Nextflow
        run: nextflow info

      # ✅ Run the workflow in the same NXF_HOME
      - name: Run fastp workflow
        run: |
          nextflow run modules/fastp.nf --params-file config_files/fastp.yaml
