# PEMA : a Pipeline for Environmental DNA Metabarcoding Analysis
# Author: Haris Zafeiropoulos
# Licensed under GNU LGPL.3, see LICENCE file
#
# Lint the pipeline and run the sanity check (sanity_check/run_sanity_check.sh).
#
# On every push and pull request, the tests that need no external database run:
#   COI-rdp-custom   - fastp, Swarm, RDPClassifier trained on sanity_check/custom_rdp/custom_ref_db
#   COI-crest-custom - fastp, Swarm, crest4 database built from sanity_check/custom_crest/custom_ref_db
# Any other test (e.g. 16S 18S-vsearch, which download the crest4 SILVA database, ~4 GB) can be run
# from the Actions tab: "Run workflow", with the tests to run.

name: pema-nf

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tests:
        description: 'Sanity check tests to run, separated by spaces (see sanity_check/run_sanity_check.sh --help)'
        required: true
        default: 'COI-rdp-custom COI-crest-custom'

env:
  NXF_VER: 26.04.7
  NXF_ANSI_LOG: false

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Installed in the job's folder (no root needed), and added to the PATH of the next steps
      - name: Install Nextflow
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -s https://get.nextflow.io | bash
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          ./nextflow -version

      - name: Lint
        run: nextflow lint pema.nf modules/ nextflow.config


  tests:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.tests.outputs.matrix }}
    steps:
      - name: Tests to run
        id: tests
        run: |
          tests="${{ github.event.inputs.tests || 'COI-rdp-custom COI-crest-custom' }}"
          echo "matrix=$(printf '%s\n' $tests | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"


  sanity:
    needs: [lint, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.tests.outputs.matrix) }}
    name: sanity (${{ matrix.test }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Installed in the job's folder (no root needed), and added to the PATH of the next steps
      - name: Install Nextflow
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -s https://get.nextflow.io | bash
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          ./nextflow -version

      # The pema-nf image holds the scripts/ of the repository: build it from this commit,
      # with the tag the modules use, so the tests run the scripts being tested
      - name: Build the pema-nf image
        run: |
          for tag in $(grep -rhoE 'hariszaf/pema-nf:[0-9.]+' modules/ | sort -u); do
            docker build -q -f containers/Dockerfile.pema_nf -t "$tag" .
          done

      - name: Cache the sanity dataset
        uses: actions/cache@v4
        with:
          path: sanity_check/sanity_data.tar.gz
          key: sanity-data-1NoZfw3IOWksc1AnSr46HkOMoFautaiTO

      # crest4 downloads its built-in databases on first use; keep them between runs.
      # In the job's temporary folder, not in ~/.crest4, so a local run (e.g. with act) does not touch yours
      - name: Cache the crest4 databases
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/crest4
          key: crest4-dbs-${{ matrix.test }}

      - name: Run the sanity check
        env:
          CREST_DBS: ${{ runner.temp }}/crest4
        run: sanity_check/run_sanity_check.sh ${{ matrix.test }} | tee sanity_summary.txt

      # Show why a test failed, in the job output: the errors and the end of its Nextflow log
      - name: Show the errors
        if: failure()
        run: |
          for log in sanity_check/*/TEST_*.log; do
            [ -f "$log" ] || continue
            echo "::group::${log}"
            echo "--- errors:"
            grep -E "ERROR|Error|Caused by|Command error|exceeds|exit status" -A4 "$log" | head -n 80 || true
            echo "--- last lines:"
            tail -n 40 "$log"
            echo "::endgroup::"
            grep -m1 -A3 "Caused by" "$log" | tail -n 3 | sed "s|^|::error title=${{ matrix.test }}::|" || true
          done

      # The containers run as root: give the files they wrote back to the runner user, so the cache
      # can be saved and the job folder cleaned up (with Docker, so no sudo is needed)
      - name: Give the files written by the containers back to the runner user
        if: always()
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/workspace -v "$RUNNER_TEMP":/runner_temp alpine:3 \
              chown -R "$(id -u):$(id -g)" /workspace /runner_temp

      - name: Summary
        if: always()
        run: |
          {
            echo "### Sanity check: ${{ matrix.test }}"
            echo '```'
            sed -n '/Sanity check summary/,$p' sanity_summary.txt 2>/dev/null || true
            grep -h -m1 -A3 "Caused by" sanity_check/*/TEST_*.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.test }}
          path: |
            sanity_check/*/TEST_*.log
            sanity_check/*/TEST_*.yaml
            sanity_check/*/.nextflow.log
          if-no-files-found: ignore
